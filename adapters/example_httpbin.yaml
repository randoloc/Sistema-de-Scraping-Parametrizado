# Adaptador de ejemplo: demo local (no requiere internet)
# Apunta al endpoint /api/demo del propio servicio.
# Los selectores buscan items dentro de contenedores .item.
name: demo_local
site: localhost
vertical: test
search_url: "http://localhost:8000/api/demo"
container_selector: ".item"
fields:
  - name: titulo
    selector: ".title"
    type: text
  - name: descripcion
    selector: ".desc"
    type: text
  - name: precio
    selector: ".price"
    type: price

# Mapeo a schema canónico
canonical_map:
  title: titulo
  description: descripcion
  price: precio
