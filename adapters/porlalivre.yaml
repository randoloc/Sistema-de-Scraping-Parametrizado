# Adaptador: Porlalivre (porlalivre.com)
# Clasificados cubanos — múltiples categorías
# ─────────────────────────────────────────────────────────────
# ESTADO: DESHABILITADO (2026)
# El sitio fue renovado y ahora usa JavaScript SPA (similar a revolico.com).
# Los selectores CSS de BS4 no funcionan con HTML renderizado por JS.
# Los selectores son placeholders → no devuelven resultados.
# Se reactivará cuando se implemente un extractor headless/browser.
# ─────────────────────────────────────────────────────────────
name: porlalivre
site: porlalivre.com
vertical: disabled
search_url: "https://www.porlalivre.com/search/{query}"
container_selector: "article.item, div.listing, div.ad-item"
pagination: "?page={page}"
fields:
  - name: titulo
    selector: "h3 a, .item-title a, .title"
    type: text
  - name: descripcion
    selector: ".description, .item-desc, p.desc"
    type: text
  - name: precio
    selector: ".price, .item-price, .precio"
    type: price
  - name: ubicacion
    selector: ".location, .item-location, .ubicacion"
    type: text
  - name: fecha
    selector: ".date, .item-date, .fecha"
    type: text
  - name: url
    selector: "h3 a, .item-title a"
    type: url
  - name: imagen
    selector: "img.thumb, .item-image img, img"
    type: image

canonical_map:
  title: titulo
  description: descripcion
  price: precio
  url: url
