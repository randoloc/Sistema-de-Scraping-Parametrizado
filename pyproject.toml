[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapper-generico"
version = "0.1.0"
description = "Sistema completo de scraping genérico: servicio, admin desktop y entregas multi-canal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Randy", email = "randy@cid3.com" },
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "httpx>=0.25",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
modulo1 = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "gradio>=4.0",
]
modulo2 = [
    "PySide6>=6.6",
    "httpx>=0.25",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]
# All extras
all = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.6",
    "gradio>=4.0",
    "PySide6>=6.6",
    "httpx>=0.25",
    "jinja2>=3.1",
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]

[tool.setuptools.packages.find]
include = [
    "modulo_1_servicio*",
    "modulo_2_admin*",
    "modulo_3_resultados*",
]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: tests that are slow",
    "network: tests that require network access",
    "integration: tests that require external services",
]

[tool.coverage.run]
source = [
    "modulo_1_servicio",
    "modulo_2_admin",
    "modulo_3_resultados",
]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests/"]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false
